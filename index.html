<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NG-RTS</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e12; }
      #app { width: 100%; height: 100%; }
      #hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
      .hud-slot { position: absolute; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.15); }
      /* placeholder HUD slots for later chunks */
      #hud-top    { top: 0; left: 0; right: 0; height: 48px; }
      #hud-bottom { bottom: 0; left: 0; width: 420px; height: 160px; }
      #hud-side   { top: 64px; right: 0; width: 220px; height: 70%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div class="hud-slot" id="hud-top"></div>
      <div class="hud-slot" id="hud-bottom"></div>
      <div class="hud-slot" id="hud-side"></div>
      <canvas id="minimap" style="position:absolute;top:56px;right:214px;width:160px;height:160px;background:#111;border:1px solid #666"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
